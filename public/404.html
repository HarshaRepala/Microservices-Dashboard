<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      var path = window.location.pathname;
      var repo = "/Microservices-Dashboard";

      if (path.startsWith(repo)) {
        path = path.substring(repo.length);
      }

      sessionStorage.redirect = path + window.location.search;

      window.location.replace(repo + "/");
    </script>
  </head>
  <body></body>
</html>
